<!DOCTYPE html>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 320px; padding: 0 }
  #menu { padding: 12px }
  /* The editor is editor.html itself, so the panel and the standalone window
     stay one implementation. Auto-height is set on load. */
  #editor { width: 320px; border: 0 }
  #editor:not([hidden]) { display: block }
  #badge {
    display: block; text-align: center; font-size: 15px; font-weight: 600;
    letter-spacing: .04em; padding: 12px; border-radius: 8px; margin-bottom: 8px;
    background: #21262d; color: #9aa4ae; border: 1px solid #2c3038;
  }
  #badge.saved { background: #14532d; color: #86efac; border-color: #16a34a }
  #badge.hoarded { background: #422006; color: #fcd34d; border-color: #a16207 }
  .menu { display: flex; flex-direction: column; gap: 6px; margin-top: 12px }
  .menu button { text-align: left }
  .menu button[hidden] { display: none }
  #status { flex: 1; font-size: 11px; color: #9aa4ae }
</style>

<div id="menu">
<div id="badge">…</div>
<div class="host" id="host"></div>
<div class="menu">
  <button class="go" id="save">Save current tab</button>
  <button id="forget" hidden>Forget saved tab</button>
  <button id="export">Export saved tabs</button>
  <button id="closeHoarded">Close hoarded tabs</button>
  <button id="prefs">Options</button>
</div>
<footer><span id="status"></span></footer>
</div>
<iframe id="editor" hidden></iframe>
<script src="lib.js"></script>
<script src="popup.js"></script>
