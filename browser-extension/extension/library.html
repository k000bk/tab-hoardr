<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tab Hoardr — Saved tabs</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { min-width: 320px; min-height: 100vh; padding: 0; }
    .library-header { display: flex; min-height: 56px; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid var(--border); background: var(--background-primary-alt); }
    .library-heading { min-width: 0; }
    .library-title { font-size: 14px; font-weight: 600; }
    .library-count { margin-top: 1px; color: var(--text-faint); font-size: 12px; }
    .library-header button { margin-left: auto; }
    .library-content { width: min(820px, 100%); margin: 0 auto; padding: 34px 28px 44px; }
    .library-content h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
    .library-intro { margin: 0 0 22px; color: var(--text-muted); }
    .search-field { position: relative; }
    .search-field > .icon { position: absolute; top: 50%; left: 12px; width: 17px; height: 17px; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search-field input { width: 100%; height: 40px; padding: 0 58px 0 38px; border: 1px solid var(--border); border-radius: var(--radius-m); outline: none; background: var(--background-primary); color: var(--text-normal); font-size: 14px; }
    .search-field input:hover { border-color: var(--border-hover); }
    .search-field input:focus { border-color: var(--border-focus); }
    .search-shortcut { position: absolute; top: 50%; right: 10px; padding: 3px 6px; transform: translateY(-50%); border: 1px solid var(--border); border-radius: var(--radius-s); background: var(--background-secondary); color: var(--text-faint); font: 10px/1 var(--font-mono); pointer-events: none; }
    .library-tools { display: flex; min-height: 54px; align-items: center; gap: 8px; margin-top: 8px; }
    .results-summary { margin-right: auto; color: var(--text-muted); font-size: 12px; }
    .sort-label { color: var(--text-faint); font-size: 12px; }
    select { height: var(--input-height); padding: 0 28px 0 9px; border: 1px solid var(--border); border-radius: var(--radius-s); outline: none; background: var(--background-primary); box-shadow: var(--input-shadow); color: var(--text-normal); font: 12px var(--font-ui); cursor: pointer; }
    select:hover { border-color: var(--border-hover); box-shadow: var(--input-shadow-hover); }
    select:focus-visible { border-color: var(--border-focus); outline: 2px solid var(--accent); outline-offset: 2px; }
    .saved-list { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--background-primary-alt); }
    .saved-item { padding: 18px 20px 17px; }
    .saved-item + .saved-item { border-top: 1px solid var(--border); }
    .saved-item:hover { background: var(--hover); }
    .saved-item-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 18px; }
    .saved-item-head > div:first-child { min-width: 0; }
    .saved-item-title { overflow: hidden; margin: 0 0 3px; color: var(--text-normal); font-size: 15px; font-weight: 600; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
    .saved-item-url { overflow: hidden; color: var(--text-faint); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .saved-item-date { color: var(--text-faint); font-size: 11px; white-space: nowrap; }
    .saved-item-description { margin: 11px 0 8px; color: var(--text-muted); overflow-wrap: anywhere; }
    .saved-item-note { margin: 0 0 10px; padding: 8px 10px; border-left: 2px solid hsl(var(--accent-h) var(--accent-s) var(--accent-l) / .45); border-radius: 0 var(--radius-s) var(--radius-s) 0; background: var(--accent-soft); color: var(--text-muted); font-size: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .saved-item-note strong { margin-right: 5px; color: var(--text-normal); font-weight: 600; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { max-width: 100%; padding: 3px 7px; border: 1px solid var(--border); border-radius: 999px; background: var(--background-primary); color: var(--text-muted); font-size: 11px; overflow-wrap: anywhere; }
    .library-load { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 18px; color: var(--text-faint); font-size: 12px; }
    .library-load button { min-width: 132px; }
    .empty-state { padding: 54px 24px; text-align: center; }
    .empty-state strong { display: block; margin-bottom: 5px; font-size: 14px; }
    .empty-state span { color: var(--text-muted); font-size: 12px; }
    @media (max-width: 650px) {
      .library-header { padding-inline: 14px; }
      .library-content { padding: 26px 14px 34px; }
      .library-tools { flex-wrap: wrap; padding-block: 9px; }
      .results-summary { width: 100%; }
      .saved-item { padding: 15px 14px; }
      .saved-item-head { grid-template-columns: 1fr; gap: 5px; }
      .saved-item-date { white-space: normal; }
    }
    @media (max-width: 430px) {
      .sort-label { width: 100%; }
      select { flex: 1; min-width: 0; }
      .library-header button { padding-inline: 9px; }
    }
  </style>
</head>
<body>
  <header class="library-header">
    <span class="app-logo" aria-hidden="true"><svg class="icon"><use href="icons.svg#stack"></use></svg></span>
    <div class="library-heading"><div class="library-title">Tab Hoardr</div><div class="library-count" id="libraryCount">Saved tabs</div></div>
    <button id="options" type="button"><svg class="icon" aria-hidden="true"><use href="icons.svg#settings"></use></svg>Options</button>
  </header>
  <main class="library-content">
    <h1>Saved tabs</h1>
    <p class="library-intro">Search all the pages you saved with Tab Hoardr.</p>
    <div class="search-field">
      <svg class="icon" aria-hidden="true"><use href="icons.svg#search"></use></svg>
      <input id="search" type="search" placeholder="Search titles, descriptions, notes and tags" aria-label="Search saved tabs" autocomplete="off" spellcheck="false">
      <span class="search-shortcut" id="searchShortcut" aria-hidden="true">Ctrl K</span>
    </div>
    <div class="library-tools">
      <span class="results-summary" id="summary" role="status" aria-live="polite">Loading saved tabs…</span>
      <label class="sort-label" for="sortBy">Sort by</label>
      <select id="sortBy">
        <option value="savedAt">Date added</option>
        <option value="updatedAt">Date modified</option>
      </select>
      <label for="sortOrder" hidden>Order</label>
      <select id="sortOrder" aria-label="Sort order">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </div>
    <section class="saved-list" id="results" aria-label="Saved tab results"></section>
    <div class="library-load" id="loadArea" hidden>
      <button id="loadMore" type="button">Load 50 more</button>
      <span id="remaining"></span>
    </div>
  </main>
  <script src="compat.js"></script>
  <script src="lib.js"></script>
  <script src="library.js"></script>
</body>
</html>
